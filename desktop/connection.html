<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'"><title>拾文 · 连接</title><link rel="stylesheet" href="connection.css"></head><body>
<main><div class="brand">拾文 <span>SHIWEN</span> <small id="version"></small></div><h1 data-zh="选择你的资料库" data-en="Connect to your library">选择你的资料库</h1><p id="current" class="muted"></p>
<section class="desktop-settings" aria-labelledby="desktop-settings-title"><h2 id="desktop-settings-title" data-zh="桌面设置" data-en="Desktop settings">桌面设置</h2><label for="closeAction" data-zh="点击窗口关闭按钮时" data-en="When closing the window">点击窗口关闭按钮时</label><select id="closeAction" disabled><option value="quit" data-zh="退出应用" data-en="Quit application">退出应用</option><option value="tray" data-zh="关闭到托盘" data-en="Hide to system tray">关闭到托盘</option></select><p class="muted" data-zh="退出本机客户端时，仍会询问是否停止服务节点。托盘不可用时按退出流程处理。" data-en="Quitting a local client still asks whether to stop its service. If the tray is unavailable, the quit flow is used.">退出本机客户端时，仍会询问是否停止服务节点。托盘不可用时按退出流程处理。</p><p id="desktop-status" role="status" class="muted"></p></section>
<form id="connection"><fieldset><legend data-zh="服务位置" data-en="Service location">服务位置</legend><label class="choice"><input type="radio" name="mode" value="local" checked><span><strong data-zh="本机服务" data-en="This computer">本机服务</strong><small data-zh="已运行就连接，未运行则自动启动。" data-en="Connect if running; start automatically if stopped.">已运行就连接，未运行则自动启动。</small></span></label><label class="choice"><input type="radio" name="mode" value="remote"><span><strong data-zh="局域网 / 其他电脑" data-en="LAN / another computer">局域网 / 其他电脑</strong><small data-zh="连接指定服务，不启动本机资料库。" data-en="Connect to the selected server without starting a local library.">连接指定服务，不启动本机资料库。</small></span></label></fieldset>
<section id="local"><label class="line"><input id="lan" type="checkbox" checked><span data-zh="允许同一局域网内的手机和浏览器访问" data-en="Allow phones and browsers on the same LAN">允许同一局域网内的手机和浏览器访问</span></label><label class="line"><span data-zh="局域网地址" data-en="LAN address">局域网地址</span><select id="lanHost"><option value="" data-zh="自动选择" data-en="Automatic">自动选择</option></select></label><label class="line"><span data-zh="启动端口" data-en="Startup port">启动端口</span><input id="port" type="number" min="1" max="65535" value="3080"></label><p class="muted" data-zh="已有服务沿用当前监听地址；局域网 HTTP 仅用于可信网络。" data-en="A running service keeps its binding. LAN HTTP is for trusted networks.">已有服务沿用当前监听地址；局域网 HTTP 仅用于可信网络。</p></section>
<section id="remote" hidden><label for="address" data-zh="服务地址" data-en="Server address">服务地址</label><input id="address" type="text" autocomplete="url" spellcheck="false" placeholder="http://192.168.1.20:3080/"><label for="password" data-zh="访问密码" data-en="Access password">访问密码</label><input id="password" type="password" autocomplete="current-password" maxlength="1024"><label class="line"><input id="remember" type="checkbox" checked><span data-zh="记住此设备（30 天）" data-en="Remember this device (30 days)">记住此设备（30 天）</span></label><p class="muted" data-zh="已记住登录状态时可留空密码。密码不写入连接配置；HTTP 仅用于可信局域网。" data-en="Leave the password blank if already signed in. Passwords are never stored in connection preferences. HTTP is for trusted LANs.">已记住登录状态时可留空密码。密码不写入连接配置；HTTP 仅用于可信局域网。</p></section>
<p id="error" role="alert"></p><button id="submit" type="submit" data-zh="连接资料库" data-en="Connect">连接资料库</button><p class="muted" data-zh="切换服务不会搬迁或合并资料。关闭远端客户端不会停止远端服务。" data-en="Switching does not move or merge data. Closing a remote client leaves its server running.">切换服务不会搬迁或合并资料。关闭远端客户端不会停止远端服务。</p></form></main><script src="connection-ui.js"></script></body></html>
