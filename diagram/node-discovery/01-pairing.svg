<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1350" role="img"><title>01-pairing</title><defs><marker id="a-cyan" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#22d3ee"/></marker><marker id="a-green" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#34d399"/></marker><marker id="a-purple" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#a78bfa"/></marker><marker id="a-amber" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#fbbf24"/></marker><marker id="a-rose" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#fb7185"/></marker><marker id="a-gray" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#94a3b8"/></marker><marker id="a-blue" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#60a5fa"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern></defs><style>text{font-family:"Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/><polyline points="370,210 370,280" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="370,380 370,450" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="370,550 370,600" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="555,650 820,650" fill="none" stroke="#fb7185" stroke-width="1.7" marker-end="url(#a-rose)"/><polyline points="370,700 370,780" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="370,880 370,930" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="555,980 820,980" fill="none" stroke="#fb7185" stroke-width="1.7" marker-end="url(#a-rose)"/><polyline points="370,1030 370,1110" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="570,1160 790,1160" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><rect x="170" y="130" width="400" height="80" rx="10" fill="#0f172a"/><rect x="170" y="130" width="400" height="80" rx="10" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-width="1.5"/><rect x="170" y="280" width="400" height="100" rx="10" fill="#0f172a"/><rect x="170" y="280" width="400" height="100" rx="10" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-width="1.5"/><rect x="170" y="450" width="400" height="100" rx="10" fill="#0f172a"/><rect x="170" y="450" width="400" height="100" rx="10" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-width="1.5"/><polygon points="370,600.0 555.0,650 370,700.0 185.0,650" fill="#172333" stroke="#fbbf24" stroke-width="1.5"/><rect x="820" y="600" width="400" height="100" rx="10" fill="#0f172a"/><rect x="820" y="600" width="400" height="100" rx="10" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-width="1.5"/><rect x="170" y="780" width="400" height="100" rx="10" fill="#0f172a"/><rect x="170" y="780" width="400" height="100" rx="10" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-width="1.5"/><polygon points="370,930.0 555.0,980 370,1030.0 185.0,980" fill="#172333" stroke="#fbbf24" stroke-width="1.5"/><rect x="820" y="930" width="400" height="100" rx="10" fill="#0f172a"/><rect x="820" y="930" width="400" height="100" rx="10" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-width="1.5"/><rect x="170" y="1110" width="400" height="100" rx="10" fill="#0f172a"/><rect x="170" y="1110" width="400" height="100" rx="10" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-width="1.5"/><text x="40" y="48" text-anchor="start" font-size="30" fill="#f1f5f9">首次配对 · 把地址绑定到可信服务</text><text x="40" y="83" text-anchor="start" font-size="17" fill="#94a3b8">方案 v3 · 青色步骤需要用户操作；绿色步骤自动执行；失败时原节点和手机资料保持不变</text><text x="370.0" y="160" text-anchor="middle" font-size="20" fill="#f1f5f9">用户：选择已有节点或添加服务</text><text x="370.0" y="187" text-anchor="middle" font-size="16" fill="#94a3b8">入口：附近服务 / 手动地址</text><text x="370.0" y="310" text-anchor="middle" font-size="20" fill="#f1f5f9">用户：扫描电脑显示的配对二维码</text><text x="370.0" y="337" text-anchor="middle" font-size="16" fill="#94a3b8">确认服务名称与来源</text><text x="370.0" y="361" text-anchor="middle" font-size="16" fill="#94a3b8">二维码含身份指纹及一次性配对凭据</text><text x="370.0" y="480" text-anchor="middle" font-size="20" fill="#f1f5f9">自动：建立加密连接并核验公钥</text><text x="370.0" y="507" text-anchor="middle" font-size="16" fill="#94a3b8">使用扫码得到的可信指纹</text><text x="370.0" y="531" text-anchor="middle" font-size="16" fill="#94a3b8">不采信局域网公告自报的身份</text><text x="370" y="656" text-anchor="middle" font-size="18" fill="#f1f5f9">连接身份验证通过？</text><text x="1020.0" y="630" text-anchor="middle" font-size="20" fill="#f1f5f9">拒绝配对</text><text x="1020.0" y="657" text-anchor="middle" font-size="16" fill="#94a3b8">不发送配对凭据、密码或资料</text><text x="1020.0" y="681" text-anchor="middle" font-size="16" fill="#94a3b8">用户可检查电脑后重新扫码</text><text x="680" y="630" text-anchor="middle" font-size="15" fill="#fb7185">否</text><text x="370.0" y="810" text-anchor="middle" font-size="20" fill="#f1f5f9">自动：核销配对凭据、获得设备授权</text><text x="370.0" y="837" text-anchor="middle" font-size="16" fill="#94a3b8">校验有效期、一次性及尝试限制</text><text x="370.0" y="861" text-anchor="middle" font-size="16" fill="#94a3b8">复用服务端权限与撤销机制</text><text x="405" y="740.0" text-anchor="middle" font-size="15" fill="#60a5fa">是</text><text x="370" y="986" text-anchor="middle" font-size="18" fill="#f1f5f9">配对及授权成功？</text><text x="1020.0" y="960" text-anchor="middle" font-size="20" fill="#f1f5f9">保留原配置，提示具体原因</text><text x="1020.0" y="987" text-anchor="middle" font-size="16" fill="#94a3b8">过期 / 已使用 / 授权失败</text><text x="1020.0" y="1011" text-anchor="middle" font-size="16" fill="#94a3b8">不创建半成品节点或清空旧授权</text><text x="680" y="960" text-anchor="middle" font-size="15" fill="#fb7185">否</text><text x="370.0" y="1140" text-anchor="middle" font-size="20" fill="#f1f5f9">自动：提交身份、地址和授权</text><text x="370.0" y="1167" text-anchor="middle" font-size="16" fill="#94a3b8">已有节点沿用原 nodeId</text><text x="370.0" y="1191" text-anchor="middle" font-size="16" fill="#94a3b8">资料库绑定不因配对自动重建</text><text x="405" y="1070.0" text-anchor="middle" font-size="15" fill="#60a5fa">是</text><text x="1000" y="1150" text-anchor="middle" font-size="20" fill="#60a5fa">下一步：日常连接流程</text><text x="650.0" y="1280" text-anchor="middle" font-size="17" fill="#fbbf24">旧 HTTP 节点可继续兼容使用；可信配对完成前，不启用自动发现地址上的凭据与数据迁移</text></svg>