e" stroke="#94a3b8" stroke-width="1.7" marker-end="url(#a-gray)"/><polyline points="195,580 195,650" fill="none" stroke="#94a3b8" stroke-width="1.7" marker-end="url(#a-gray)"/><polyline points="505,580 505,650" fill="none" stroke="#94a3b8" stroke-width="1.7" marker-end="url(#a-gray)"/><polyline points="370,695 330,695" fill="none" stroke="#34d399" stroke-width="1.7" marker-end="url(#a-green)"/><polyline points="505,740 505,810" fill="none" stroke="#94a3b8" stroke-width="1.7" marker-end="url(#a-gray)"/><polyline points="860,365 640,365" fill="none" stroke="#fbbf24" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#a-amber)"/><polyline points="195,740 195,775 710,775 710,695 860,695" fill="none" stroke="#fb7185" stroke-width="1.7" marker-end="url(#a-rose)"/><polyline points="1150,260 1150,320" fill="none" stroke="#94a3b8" stroke-width="1.7" marker-end="url(#a-gray)"/><polyline points="860,220 845,220 845,610 995,610 995,650" fill="none" stroke="#94a3b8" stroke-width="1.7" marker-end="url(#a-gray)"/><polyline points="1305,580 1305,650" fill="none" stroke="#fb7185" stroke-width="1.7" marker-end="url(#a-rose)"/><polyline points="1130,695 1170,695" fill="none" stroke="#34d399" stroke-width="1.7" marker-end="url(#a-green)"/><polyline points="1305,740 1305,810" fill="none" stroke="#94a3b8" stroke-width="1.7" marker-end="url(#a-gray)"/><rect x="60" y="180" width="580" height="80" rx="10" fill="#0f172a"/><rect x="60" y="180" width="580" height="80" rx="10" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-width="1.5"/><rect x="60" y="320" width="270" height="90" rx="10" fill="#0f172a"/><rect x="60" y="320" width="270" height="90" rx="10" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-width="1.5"/><rect x="370" y="320" width="270" height="90" rx="10" fill="#0f172a"/><rect x="370" y="320" width="270" height="90" rx="10" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-width="1.5"/><rect x="60" y="470" width="580" height="110" rx="10" fill="#0f172a"/><rect x="60" y="470" width="580" height="110" rx="10" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-width="1.5"/><rect x="60" y="650" width="270" height="90" rx="10" fill="#0f172a"/><rect x="60" y="650" width="270" height="90" rx="10" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-width="1.5"/><rect x="370" y="650" width="270" height="90" rx="10" fill="#0f172a"/><rect x="370" y="650" width="270" height="90" rx="10" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-width="1.5"/><rect x="60" y="810" width="580" height="80" rx="10" fill="#0f172a"/><rect x="60" y="810" width="580" height="80" rx="10" fill="#a78bfa" fill-opacity=".08" stroke="#a78bfa" stroke-width="1.5"/><rect x="860" y="180" width="580" height="80" rx="10" fill="#0f172a"/><rect x="860" y="180" width="580" height="80" rx="10" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-width="1.5"/><rect x="860" y="320" width="580" height="90" rx="10" fill="#0f172a"/><rect x="860" y="320" width="580" height="90" rx="10" fill="#fbbf24" fill-opacity=".08" stroke="#fbbf24" stroke-width="1.5"/><rect x="1170" y="470" width="270" height="110" rx="10" fill="#0f172a"/><rect x="1170" y="470" width="270" height="110" rx="10" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-width="1.5"/><rect x="860" y="650" width="270" height="90" rx="10" fill="#0f172a"/><rect x="860" y="650" width="270" height="90" rx="10" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-width="1.5"/><rect x="1170" y="650" width="270" height="90" rx="10" fill="#0f172a"/><rect x="1170" y="650" width="270" height="90" rx="10" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-width="1.5"/><rect x="860" y="810" width="580" height="80" rx="10" fill="#0f172a"/><rect x="860" y="810" width="580" height="80" rx="10" fill="#a78bfa" fill-opacity=".08" stroke="#a78bfa" stroke-width="1.5"/><text x="40" y="48" text-anchor="start" font-size="30" fill="#f1f5f9">拾文 · 多地址与局域网发现架构</text><text x="40" y="83" text-anchor="start" font-size="17" fill="#94a3b8">实施方案 v2 · 设计目标，尚未实施 · 服务身份稳定，连接地址可变</text><text x="50" y="150" text-anchor="start" font-size="20" fill="#fbbf24">Android 手机</text><text x="850" y="150" text-anchor="start" font-size="20" fill="#fbbf24">电脑端拾文服务</text><text x="350.0" y="210" text-anchor="middle" font-size="20" fill="#f1f5f9">节点设置与连接状态〔改造〕</text><text x="350.0" y="237" text-anchor="middle" font-size="16" fill="#94a3b8">附近服务 · 多地址 · 在线 / 离线 / 需登录 / 身份异常</text><text x="195.0" y="350" text-anchor="middle" font-size="20" fill="#f1f5f9">握手监控〔新增〕</text><text x="195.0" y="377" text-anchor="middle" font-size="16" fill="#94a3b8">前台定时 / 网络变化</text><text x="195.0" y="401" text-anchor="middle" font-size="16" fill="#94a3b8">合并检查 · 失败退避</text><text x="505.0" y="350" text-anchor="middle" font-size="20" fill="#f1f5f9">局域网发现〔新增〕</text><text x="505.0" y="377" text-anchor="middle" font-size="16" fill="#94a3b8">Android NSD</text><text x="505.0" y="401" text-anchor="middle" font-size="16" fill="#94a3b8">候选地址，不代表信任</text><text x="350.0" y="500" text-anchor="middle" font-size="20" fill="#f1f5f9">统一连接协调器〔新增〕</text><text x="350.0" y="527" text-anchor="middle" font-size="16" fill="#94a3b8">地址选择 · 服务身份核验 · 授权检查</text><text x="350.0" y="551" text-anchor="middle" font-size="16" fill="#94a3b8">配置版本 ≠ 连接代次；正常连接不反复切换</text><text x="195.0" y="680" text-anchor="middle" font-size="20" fill="#f1f5f9">可信连接客户端〔改造〕</text><text x="195.0" y="707" text-anchor="middle" font-size="16" fill="#94a3b8">HTTPS / 公钥绑定</text><text x="195.0" y="731" text-anchor="middle" font-size="16" fill="#94a3b8">节点级授权与撤销</text><text x="505.0" y="680" text-anchor="middle" font-size="20" fill="#f1f5f9">同步与业务调用〔改造〕</text><text x="505.0" y="707" text-anchor="middle" font-size="16" fill="#94a3b8">保留现有同步协议</text><text x="505.0" y="731" text-anchor="middle" font-size="16" fill="#94a3b8">写入结果未知先核对</text><text x="350.0" y="840" text-anchor="middle" font-size="20" fill="#f1f5f9">手机加密节点配置 + 本地资料库〔改造 / 复用〕</text><text x="350.0" y="867" text-anchor="middle" font-size="16" fill="#94a3b8">稳定 nodeId · 身份指纹 · 地址来源 · 游标 · 待上传记录</text><text x="1150.0" y="210" text-anchor="middle" font-size="20" fill="#f1f5f9">服务与网卡生命周期〔改造〕</text><text x="1150.0" y="237" text-anchor="middle" font-size="16" fill="#94a3b8">新入口就绪后发布；换网不直接终止资料库写入</text><text x="1150.0" y="350" text-anchor="middle" font-size="20" fill="#f1f5f9">mDNS / DNS-SD 公告〔新增〕</text><text x="1150.0" y="377" text-anchor="middle" font-size="16" fill="#94a3b8">_shiwen._tcp · 名称 / 协议 / 身份指纹 / 端口</text><text x="1150.0" y="401" text-anchor="middle" font-size="16" fill="#94a3b8">仅发布实际可达的局域网入口</text><text x="1305.0" y="500" text-anchor="middle" font-size="20" fill="#f1f5f9">身份与配对〔新增〕</text><text x="1305.0" y="527" text-anchor="middle" font-size="16" fill="#94a3b8">持久服务密钥</text><text x="1305.0" y="551" text-anchor="middle" font-size="16" fill="#94a3b8">扫码确认 · 一次性凭据</text><text x="1305.0" y="575" text-anchor="middle" font-size="16" fill="#94a3b8">对接现有认证与撤销</text><text x="995.0" y="680" text-anchor="middle" font-size="20" fill="#f1f5f9">可信 HTTPS 入口〔新增〕</text><text x="995.0" y="707" text-anchor="middle" font-size="16" fill="#94a3b8">监听 / 认证架构先验证</text><text x="995.0" y="731" text-anchor="middle" font-size="16" fill="#94a3b8">身份绑定到传输连接</text><text x="1305.0" y="680" text-anchor="middle" font-size="20" fill="#f1f5f9">现有业务服务〔复用〕</text><text x="1305.0" y="707" text-anchor="middle" font-size="16" fill="#94a3b8">同步 · 附件 · 聊天</text><text x="1305.0" y="731" text-anchor="middle" font-size="16" fill="#94a3b8">既有授权与操作回执</text><text x="1150.0" y="840" text-anchor="middle" font-size="20" fill="#f1f5f9">电脑资料库与身份存储〔复用 / 新增〕</text><text x="1150.0" y="867" text-anchor="middle" font-size="16" fill="#94a3b8">业务数据与服务私钥分开；普通资料备份不复制私钥</text><text x="750" y="348" text-anchor="middle" font-size="15" fill="#fbbf24">发现公告</text><text x="748" y="675" text-anchor="middle" font-size="15" fill="#fb7185">经验证的业务连接</text><text x="1352" y="618" text-anchor="middle" font-size="15" fill="#fb7185">授权校验</text><text x="750" y="970" text-anchor="middle" font-size="19" fill="#fbbf24">信任边界：发现 ≠ 配对；配对身份 ≠ 登录状态；服务身份 ≠ 资料库身份</text><text x="750" y="1006" text-anchor="middle" font-size="17" fill="#94a3b8">迁移约束：旧 HTTP 节点保留；完成可信配对前，不向自动发现的新地址发送凭据或资料</text><text x="750" y="1042" text-anchor="middle" font-size="17" fill="#fb7185">首阶段验证项：HTTPS 接入方式、现有认证复用、换网监听切换与旧客户端兼容</text></svg>