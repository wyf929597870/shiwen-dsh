<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 1680" role="img"><title>04-network-change</title><defs><marker id="a-cyan" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#22d3ee"/></marker><marker id="a-green" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#34d399"/></marker><marker id="a-purple" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#a78bfa"/></marker><marker id="a-amber" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#fbbf24"/></marker><marker id="a-rose" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#fb7185"/></marker><marker id="a-gray" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#94a3b8"/></marker><marker id="a-blue" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#60a5fa"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern></defs><style>text{font-family:"Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/><polyline points="420,220 420,310" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="420,400 420,460" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="610,510 930,510" fill="none" stroke="#fb7185" stroke-width="1.7" marker-end="url(#a-rose)"/><polyline points="420,560 420,670" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="420,770 420,820" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="610,870 930,870" fill="none" stroke="#fb7185" stroke-width="1.7" marker-end="url(#a-rose)"/><polyline points="420,920 420,1030" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="420,1130 420,1180" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="610,1230 930,1230" fill="none" stroke="#fb7185" stroke-width="1.7" marker-end="url(#a-rose)"/><polyline points="420,1280 420,1400" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="1155,1300 1155,1445 630,1445" fill="none" stroke="#94a3b8" stroke-width="1.7" marker-end="url(#a-gray)"/><rect x="210" y="130" width="420" height="90" rx="10" fill="#0f172a"/><rect x="210" y="130" width="420" height="90" rx="10" fill="#60a5fa" fill-opacity=".08" stroke="#60a5fa" stroke-width="1.5"/><rect x="210" y="310" width="420" height="90" rx="10" fill="#0f172a"/><rect x="210" y="310" width="420" height="90" rx="10" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-width="1.5"/><polygon points="420,460.0 610.0,510 420,560.0 230.0,510" fill="#172333" stroke="#fbbf24" stroke-width="1.5"/><rect x="930" y="460" width="450" height="100" rx="10" fill="#0f172a"/><rect x="930" y="460" width="450" height="100" rx="10" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-width="1.5"/><rect x="210" y="670" width="420" height="100" rx="10" fill="#0f172a"/><rect x="210" y="670" width="420" height="100" rx="10" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-width="1.5"/><polygon points="420,820.0 610.0,870 420,920.0 230.0,870" fill="#172333" stroke="#fbbf24" stroke-width="1.5"/><rect x="930" y="820" width="450" height="100" rx="10" fill="#0f172a"/><rect x="930" y="820" width="450" height="100" rx="10" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-width="1.5"/><rect x="210" y="1030" width="420" height="100" rx="10" fill="#0f172a"/><rect x="210" y="1030" width="420" height="100" rx="10" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-width="1.5"/><polygon points="420,1180.0 610.0,1230 420,1280.0 230.0,1230" fill="#172333" stroke="#fbbf24" stroke-width="1.5"/><rect x="930" y="1180" width="450" height="120" rx="10" fill="#0f172a"/><rect x="930" y="1180" width="450" height="120" rx="10" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-width="1.5"/><rect x="210" y="1400" width="420" height="90" rx="10" fill="#0f172a"/><rect x="210" y="1400" width="420" height="90" rx="10" fill="#60a5fa" fill-opacity=".08" stroke="#60a5fa" stroke-width="1.5"/><text x="40" y="48" text-anchor="start" font-size="30" fill="#f1f5f9">电脑换网 · 先建新入口，再收尾旧连接</text><text x="40" y="83" text-anchor="start" font-size="17" fill="#94a3b8">方案 v3 · 自动处理网络变化；用户手动选择网卡时使用同一流程 · 不因换 IP 直接重启资料库</text><text x="420.0" y="160" text-anchor="middle" font-size="20" fill="#f1f5f9">检测网卡、地址或监听配置变化</text><text x="420.0" y="187" text-anchor="middle" font-size="16" fill="#94a3b8">事件合并与防抖；区分用户指定和自动选择</text><text x="420.0" y="340" text-anchor="middle" font-size="20" fill="#f1f5f9">撤销失效地址的发现公告</text><text x="420.0" y="367" text-anchor="middle" font-size="16" fill="#94a3b8">仍有效的旧入口可继续服务</text><text x="420.0" y="391" text-anchor="middle" font-size="16" fill="#94a3b8">公告失效不等于立刻杀掉已建立的连接</text><text x="420" y="516" text-anchor="middle" font-size="18" fill="#f1f5f9">有可用且允许发布的地址？</text><text x="1155.0" y="490" text-anchor="middle" font-size="20" fill="#f1f5f9">保持本机使用，标记局域网不可用</text><text x="1155.0" y="517" text-anchor="middle" font-size="16" fill="#94a3b8">不发布回环地址到局域网</text><text x="1155.0" y="541" text-anchor="middle" font-size="16" fill="#94a3b8">等待网络恢复，或用户选择网卡</text><text x="775" y="492" text-anchor="middle" font-size="15" fill="#fb7185">否</text><text x="420.0" y="700" text-anchor="middle" font-size="20" fill="#f1f5f9">建立新网络入口并检查就绪</text><text x="420.0" y="727" text-anchor="middle" font-size="16" fill="#94a3b8">实际绑定新地址，复用既有业务服务</text><text x="420.0" y="751" text-anchor="middle" font-size="16" fill="#94a3b8">校验可信连接、认证与必要接口</text><text x="455" y="615.0" text-anchor="middle" font-size="15" fill="#60a5fa">是</text><text x="420" y="876" text-anchor="middle" font-size="18" fill="#f1f5f9">新入口已就绪？</text><text x="1155.0" y="850" text-anchor="middle" font-size="20" fill="#f1f5f9">不发布新地址，保留可用旧入口</text><text x="1155.0" y="877" text-anchor="middle" font-size="16" fill="#94a3b8">记录监听失败 / 端口冲突等原因</text><text x="1155.0" y="901" text-anchor="middle" font-size="16" fill="#94a3b8">本机继续可用；按退避策略重试</text><text x="775" y="852" text-anchor="middle" font-size="15" fill="#fb7185">否</text><text x="420.0" y="1060" text-anchor="middle" font-size="20" fill="#f1f5f9">发布新地址；收尾不再保留的旧入口</text><text x="420.0" y="1087" text-anchor="middle" font-size="16" fill="#94a3b8">新地址可用后才发布 mDNS 公告</text><text x="420.0" y="1111" text-anchor="middle" font-size="16" fill="#94a3b8">旧入口停止接收新请求；不强杀业务写入</text><text x="455" y="975.0" text-anchor="middle" font-size="15" fill="#60a5fa">是</text><text x="420" y="1236" text-anchor="middle" font-size="18" fill="#f1f5f9">旧连接请求已结束？</text><text x="1155.0" y="1210" text-anchor="middle" font-size="20" fill="#f1f5f9">有界等待，不终止资料库事务</text><text x="1155.0" y="1237" text-anchor="middle" font-size="16" fill="#94a3b8">传输中断时保留服务端提交结果 / 回执</text><text x="1155.0" y="1261" text-anchor="middle" font-size="16" fill="#94a3b8">客户端按“结果未知”恢复</text><text x="1155.0" y="1285" text-anchor="middle" font-size="16" fill="#94a3b8">达到期限仅关闭网络连接，不杀业务进程</text><text x="775" y="1212" text-anchor="middle" font-size="15" fill="#fb7185">否</text><text x="420.0" y="1430" text-anchor="middle" font-size="20" fill="#f1f5f9">回收旧监听，保留新入口与本机入口</text><text x="420.0" y="1457" text-anchor="middle" font-size="16" fill="#94a3b8">服务身份、资料库和同步状态保持不变</text><text x="455" y="1340.0" text-anchor="middle" font-size="15" fill="#60a5fa">是</text><text x="1015" y="1425" text-anchor="middle" font-size="15" fill="#94a3b8">等待 / 网络收尾完成</text><text x="725.0" y="1570" text-anchor="middle" font-size="17" fill="#fbbf24">架构验证门槛：网络入口必须可独立建立与回收；若宿主不支持，先验证接入层，不以整服务重启替代</text><text x="725" y="1620" text-anchor="middle" font-size="17" fill="#94a3b8">旧 HTTP 入口迁移期继续兼容；具体双入口、认证与流式请求处理在第一阶段技术验证中定稿</text></svg>