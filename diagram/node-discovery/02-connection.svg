<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 1770" role="img"><title>02-connection</title><defs><marker id="a-cyan" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#22d3ee"/></marker><marker id="a-green" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#34d399"/></marker><marker id="a-purple" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#a78bfa"/></marker><marker id="a-amber" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#fbbf24"/></marker><marker id="a-rose" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#fb7185"/></marker><marker id="a-gray" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#94a3b8"/></marker><marker id="a-blue" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#60a5fa"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern></defs><style>text{font-family:"Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/><polyline points="420,210 420,255" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="605,300 930,300" fill="none" stroke="#fb7185" stroke-width="1.7" marker-end="url(#a-rose)"/><polyline points="420,345 420,420" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="420,530 420,585" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="605,630 930,630" fill="none" stroke="#fb7185" stroke-width="1.7" marker-end="url(#a-rose)"/><polyline points="420,675 420,750" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="420,850 420,905" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="605,950 930,950" fill="none" stroke="#fb7185" stroke-width="1.7" marker-end="url(#a-rose)"/><polyline points="1380,950 1410,950 1410,710 760,710 760,550 420,550 420,585" fill="none" stroke="#94a3b8" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#a-gray)"/><polyline points="420,995 420,1105" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="605,1150 930,1150" fill="none" stroke="#fb7185" stroke-width="1.7" marker-end="url(#a-rose)"/><polyline points="420,1195 420,1300" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="420,1400 420,1490" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="630,1350 890,1350" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><rect x="210" y="125" width="420" height="85" rx="10" fill="#0f172a"/><rect x="210" y="125" width="420" height="85" rx="10" fill="#60a5fa" fill-opacity=".08" stroke="#60a5fa" stroke-width="1.5"/><polygon points="420,255.0 605.0,300 420,345.0 235.0,300" fill="#172333" stroke="#fbbf24" stroke-width="1.5"/><rect x="930" y="255" width="450" height="90" rx="10" fill="#0f172a"/><rect x="930" y="255" width="450" height="90" rx="10" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-width="1.5"/><rect x="210" y="420" width="420" height="110" rx="10" fill="#0f172a"/><rect x="210" y="420" width="420" height="110" rx="10" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-width="1.5"/><polygon points="420,585.0 605.0,630 420,675.0 235.0,630" fill="#172333" stroke="#fbbf24" stroke-width="1.5"/><rect x="930" y="570" width="450" height="120" rx="10" fill="#0f172a"/><rect x="930" y="570" width="450" height="120" rx="10" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-width="1.5"/><rect x="210" y="750" width="420" height="100" rx="10" fill="#0f172a"/><rect x="210" y="750" width="420" height="100" rx="10" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-width="1.5"/><polygon points="420,905.0 605.0,950 420,995.0 235.0,950" fill="#172333" stroke="#fbbf24" stroke-width="1.5"/><rect x="930" y="905" width="450" height="90" rx="10" fill="#0f172a"/><rect x="930" y="905" width="450" height="90" rx="10" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-width="1.5"/><polygon points="420,1105.0 605.0,1150 420,1195.0 235.0,1150" fill="#172333" stroke="#fbbf24" stroke-width="1.5"/><rect x="930" y="1090" width="450" height="120" rx="10" fill="#0f172a"/><rect x="930" y="1090" width="450" height="120" rx="10" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-width="1.5"/><rect x="210" y="1300" width="420" height="100" rx="10" fill="#0f172a"/><rect x="210" y="1300" width="420" height="100" rx="10" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-width="1.5"/><rect x="210" y="1490" width="420" height="90" rx="10" fill="#0f172a"/><rect x="210" y="1490" width="420" height="90" rx="10" fill="#60a5fa" fill-opacity=".08" stroke="#60a5fa" stroke-width="1.5"/><text x="40" y="48" text-anchor="start" font-size="30" fill="#f1f5f9">日常连接 · 一轮检查只尝试每个候选一次</text><text x="40" y="83" text-anchor="start" font-size="17" fill="#94a3b8">方案 v3 · 全程自动；只有需要配对或授权时才转交用户 · 多地址失败后结束本轮，不无限循环</text><text x="420.0" y="155" text-anchor="middle" font-size="20" fill="#f1f5f9">触发一次检查</text><text x="420.0" y="182" text-anchor="middle" font-size="16" fill="#94a3b8">前台 / 网络变化 / 定时 / 用户重试</text><text x="420" y="306" text-anchor="middle" font-size="18" fill="#f1f5f9">当前网络可用？</text><text x="1155.0" y="285" text-anchor="middle" font-size="20" fill="#f1f5f9">当前网络不可用</text><text x="1155.0" y="312" text-anchor="middle" font-size="16" fill="#94a3b8">保留离线记录；等待网络变化后新建一轮</text><text x="760" y="282" text-anchor="middle" font-size="15" fill="#fb7185">否</text><text x="420.0" y="450" text-anchor="middle" font-size="20" fill="#f1f5f9">建立本轮候选队列与检查编号</text><text x="420.0" y="477" text-anchor="middle" font-size="16" fill="#94a3b8">正常当前地址优先；备用与发现结果补充</text><text x="420.0" y="501" text-anchor="middle" font-size="16" fill="#94a3b8">去重、限制数量 / 总时长；固定本轮队列</text><text x="420.0" y="525" text-anchor="middle" font-size="16" fill="#94a3b8">新发现地址排入下一轮，不延长本轮无穷久</text><text x="455" y="382.5" text-anchor="middle" font-size="15" fill="#60a5fa">是</text><text x="420" y="636" text-anchor="middle" font-size="18" fill="#f1f5f9">A · 还有未尝试候选？</text><text x="1155.0" y="600" text-anchor="middle" font-size="20" fill="#f1f5f9">结束本轮，汇总原因</text><text x="1155.0" y="627" text-anchor="middle" font-size="16" fill="#94a3b8">全部不可达：重试后标记离线并退避</text><text x="1155.0" y="651" text-anchor="middle" font-size="16" fill="#94a3b8">身份异常 / 未授权 / 接口异常分别提示</text><text x="1155.0" y="675" text-anchor="middle" font-size="16" fill="#94a3b8">权限不足只影响发现，不否定已知地址</text><text x="760" y="612" text-anchor="middle" font-size="15" fill="#fb7185">否</text><text x="420.0" y="780" text-anchor="middle" font-size="20" fill="#f1f5f9">取一个候选并标记已尝试</text><text x="420.0" y="807" text-anchor="middle" font-size="16" fill="#94a3b8">若未配对，转“首次配对”流程</text><text x="420.0" y="831" text-anchor="middle" font-size="16" fill="#94a3b8">已配对：校验连接身份、服务状态和授权</text><text x="455" y="712.5" text-anchor="middle" font-size="15" fill="#60a5fa">是</text><text x="420" y="956" text-anchor="middle" font-size="18" fill="#f1f5f9">身份可信且服务有响应？</text><text x="1155.0" y="935" text-anchor="middle" font-size="20" fill="#f1f5f9">记录该候选失败原因</text><text x="1155.0" y="962" text-anchor="middle" font-size="16" fill="#94a3b8">不可达 / 身份不符；不发送凭据或资料</text><text x="760" y="932" text-anchor="middle" font-size="15" fill="#fb7185">否</text><text x="1080" y="745" text-anchor="middle" font-size="15" fill="#94a3b8">返回 A：不重置队列</text><text x="420" y="1156" text-anchor="middle" font-size="18" fill="#f1f5f9">授权可用且接口正常？</text><text x="455" y="1050.0" text-anchor="middle" font-size="15" fill="#60a5fa">是</text><text x="1155.0" y="1120" text-anchor="middle" font-size="20" fill="#f1f5f9">在线，但需要处理</text><text x="1155.0" y="1147" text-anchor="middle" font-size="16" fill="#94a3b8">授权失效：需要登录 / 授权</text><text x="1155.0" y="1171" text-anchor="middle" font-size="16" fill="#94a3b8">接口异常 / 版本不兼容：显示原因</text><text x="1155.0" y="1195" text-anchor="middle" font-size="16" fill="#94a3b8">不以离线掩盖认证错误；本轮结束</text><text x="760" y="1132" text-anchor="middle" font-size="15" fill="#fb7185">否</text><text x="420.0" y="1330" text-anchor="middle" font-size="20" fill="#f1f5f9">在线 · 保持当前或切换地址</text><text x="420.0" y="1357" text-anchor="middle" font-size="16" fill="#94a3b8">仅切换时增加连接代次</text><text x="420.0" y="1381" text-anchor="middle" font-size="16" fill="#94a3b8">保存最近成功时间；原资料库绑定不变</text><text x="455" y="1247.5" text-anchor="middle" font-size="15" fill="#60a5fa">是</text><text x="420.0" y="1520" text-anchor="middle" font-size="20" fill="#f1f5f9">结束本轮，等待下一次触发</text><text x="420.0" y="1547" text-anchor="middle" font-size="16" fill="#94a3b8">前台约 30 秒检查；后台不持续扫描</text><text x="1130" y="1360" text-anchor="middle" font-size="20" fill="#60a5fa">有同步任务 → 同步恢复流程</text><text x="725.0" y="1660" text-anchor="middle" font-size="17" fill="#fbbf24">不能仅因 mDNS 公告消失判定离线；网络切换后重新评估，不永久淘汰手动地址</text><text x="725" y="1700" text-anchor="middle" font-size="17" fill="#94a3b8">失败统计以一轮完整检查为单位；用户重试可立即开始新一轮，同节点检查必须合并</text></svg>