<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 1750" role="img"><title>03-sync-recovery</title><defs><marker id="a-cyan" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#22d3ee"/></marker><marker id="a-green" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#34d399"/></marker><marker id="a-purple" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#a78bfa"/></marker><marker id="a-amber" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#fbbf24"/></marker><marker id="a-rose" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#fb7185"/></marker><marker id="a-gray" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#94a3b8"/></marker><marker id="a-blue" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#60a5fa"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern></defs><style>text{font-family:"Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/><polyline points="420,220 420,270" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="620,320 930,320" fill="none" stroke="#fb7185" stroke-width="1.7" marker-end="url(#a-rose)"/><polyline points="420,370 420,470" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="420,570 420,620" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="620,670 930,670" fill="none" stroke="#fb7185" stroke-width="1.7" marker-end="url(#a-rose)"/><polyline points="1155,720 1155,800" fill="none" stroke="#94a3b8" stroke-width="1.7" marker-end="url(#a-gray)"/><polyline points="420,720 420,880" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="420,980 420,1050" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="610,1100 930,1100" fill="none" stroke="#fb7185" stroke-width="1.7" marker-end="url(#a-rose)"/><polyline points="420,1150 420,1260" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="420,1360 420,1460" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><rect x="210" y="130" width="420" height="90" rx="10" fill="#0f172a"/><rect x="210" y="130" width="420" height="90" rx="10" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-width="1.5"/><polygon points="420,270.0 620.0,320 420,370.0 220.0,320" fill="#172333" stroke="#fbbf24" stroke-width="1.5"/><rect x="930" y="270" width="450" height="100" rx="10" fill="#0f172a"/><rect x="930" y="270" width="450" height="100" rx="10" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-width="1.5"/><rect x="210" y="470" width="420" height="100" rx="10" fill="#0f172a"/><rect x="210" y="470" width="420" height="100" rx="10" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-width="1.5"/><polygon points="420,620.0 620.0,670 420,720.0 220.0,670" fill="#172333" stroke="#fbbf24" stroke-width="1.5"/><rect x="930" y="620" width="450" height="100" rx="10" fill="#0f172a"/><rect x="930" y="620" width="450" height="100" rx="10" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-width="1.5"/><rect x="930" y="800" width="450" height="100" rx="10" fill="#0f172a"/><rect x="930" y="800" width="450" height="100" rx="10" fill="#fbbf24" fill-opacity=".08" stroke="#fbbf24" stroke-width="1.5"/><rect x="210" y="880" width="420" height="100" rx="10" fill="#0f172a"/><rect x="210" y="880" width="420" height="100" rx="10" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-width="1.5"/><polygon points="420,1050.0 610.0,1100 420,1150.0 230.0,1100" fill="#172333" stroke="#fbbf24" stroke-width="1.5"/><rect x="930" y="1050" width="450" height="100" rx="10" fill="#0f172a"/><rect x="930" y="1050" width="450" height="100" rx="10" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-width="1.5"/><rect x="210" y="1260" width="420" height="100" rx="10" fill="#0f172a"/><rect x="210" y="1260" width="420" height="100" rx="10" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-width="1.5"/><rect x="210" y="1460" width="420" height="90" rx="10" fill="#0f172a"/><rect x="210" y="1460" width="420" height="90" rx="10" fill="#60a5fa" fill-opacity=".08" stroke="#60a5fa" stroke-width="1.5"/><text x="40" y="48" text-anchor="start" font-size="30" fill="#f1f5f9">同步恢复 · 保留编号，先确认上次结果</text><text x="40" y="83" text-anchor="start" font-size="17" fill="#94a3b8">方案 v3 · 可信服务身份、资料库身份和连接代次分别核验 · 非幂等写入不得因换 IP 自动重发</text><text x="420.0" y="160" text-anchor="middle" font-size="20" fill="#f1f5f9">取得可用、已授权的可信连接</text><text x="420.0" y="187" text-anchor="middle" font-size="16" fill="#94a3b8">不可用时转日常连接流程，保留本地任务</text><text x="420" y="326" text-anchor="middle" font-size="18" fill="#f1f5f9">libraryId / epoch 与绑定一致？</text><text x="1155.0" y="300" text-anchor="middle" font-size="20" fill="#f1f5f9">暂停同步：资料库发生变化</text><text x="1155.0" y="327" text-anchor="middle" font-size="16" fill="#94a3b8">同一服务也可能换了资料库</text><text x="1155.0" y="351" text-anchor="middle" font-size="16" fill="#94a3b8">进入恢复处理，不自动重建手机资料库</text><text x="775" y="302" text-anchor="middle" font-size="15" fill="#fb7185">否</text><text x="420.0" y="500" text-anchor="middle" font-size="20" fill="#f1f5f9">固定连接代次与现有操作编号</text><text x="420.0" y="527" text-anchor="middle" font-size="16" fill="#94a3b8">读取已保存的游标、待上传及附件进度</text><text x="420.0" y="551" text-anchor="middle" font-size="16" fill="#94a3b8">配置 / 信任关系改变时中止旧任务</text><text x="455" y="420.0" text-anchor="middle" font-size="15" fill="#60a5fa">是</text><text x="420" y="676" text-anchor="middle" font-size="18" fill="#f1f5f9">有写入结果尚未确认？</text><text x="1155.0" y="650" text-anchor="middle" font-size="20" fill="#f1f5f9">用原操作编号查询结果 / 核对回执</text><text x="1155.0" y="677" text-anchor="middle" font-size="16" fill="#94a3b8">已提交：接收原回执，不重复写</text><text x="1155.0" y="701" text-anchor="middle" font-size="16" fill="#94a3b8">仍未知：保持待确认，不生成新操作编号</text><text x="775" y="652" text-anchor="middle" font-size="15" fill="#fb7185">是</text><text x="1155.0" y="830" text-anchor="middle" font-size="20" fill="#f1f5f9">仅协议明确允许时恢复写入</text><text x="1155.0" y="857" text-anchor="middle" font-size="16" fill="#94a3b8">未执行且支持幂等：复用原编号重试</text><text x="1155.0" y="881" text-anchor="middle" font-size="16" fill="#94a3b8">仍处理中 / 无法确认：等待或提示处理</text><text x="420.0" y="910" text-anchor="middle" font-size="20" fill="#f1f5f9">执行本轮读写 / 继续附件传输</text><text x="420.0" y="937" text-anchor="middle" font-size="16" fill="#94a3b8">普通读请求可在核验新连接后重试</text><text x="420.0" y="961" text-anchor="middle" font-size="16" fill="#94a3b8">同步写遵守既有协议和确认机制</text><text x="455" y="800.0" text-anchor="middle" font-size="15" fill="#60a5fa">否</text><text x="420" y="1106" text-anchor="middle" font-size="18" fill="#f1f5f9">本次结果已明确？</text><text x="1155.0" y="1080" text-anchor="middle" font-size="20" fill="#f1f5f9">断线 / 超时 / 写入结果未知</text><text x="1155.0" y="1107" text-anchor="middle" font-size="16" fill="#94a3b8">保留操作编号、游标和临时附件</text><text x="1155.0" y="1131" text-anchor="middle" font-size="16" fill="#94a3b8">重新取得可信连接后，从本图顶部恢复</text><text x="775" y="1082" text-anchor="middle" font-size="15" fill="#fb7185">否</text><text x="420.0" y="1290" text-anchor="middle" font-size="20" fill="#f1f5f9">按原编号处理明确结果</text><text x="420.0" y="1317" text-anchor="middle" font-size="16" fill="#94a3b8">成功：提交回执并推进同步进度</text><text x="420.0" y="1341" text-anchor="middle" font-size="16" fill="#94a3b8">明确拒绝：保留内容并显示错误原因</text><text x="455" y="1205.0" text-anchor="middle" font-size="15" fill="#60a5fa">是</text><text x="420.0" y="1490" text-anchor="middle" font-size="20" fill="#f1f5f9">继续下一批，或完成同步</text><text x="420.0" y="1517" text-anchor="middle" font-size="16" fill="#94a3b8">旧连接响应不得覆盖当前连接状态</text><text x="1155" y="1290" text-anchor="middle" font-size="20" fill="#fbbf24">恢复路径的出口</text><text x="1155" y="1330" text-anchor="middle" font-size="17" fill="#94a3b8">获得提交回执 → 左侧“处理明确结果”</text><text x="1155" y="1370" text-anchor="middle" font-size="17" fill="#94a3b8">允许原编号重试 → 左侧“执行本轮读写”</text><text x="1155" y="1410" text-anchor="middle" font-size="17" fill="#94a3b8">仍未确认 → 暂停等待，不推进游标</text><text x="725.0" y="1630" text-anchor="middle" font-size="17" fill="#fbbf24">连接地址变化不清空 outbox，不重置游标，不创建新 nodeId，不创建重复手机副本</text><text x="725" y="1680" text-anchor="middle" font-size="17" fill="#94a3b8">本图针对同步协议；聊天发送和设置修改不能直接套用自动写入重试规则</text></svg>