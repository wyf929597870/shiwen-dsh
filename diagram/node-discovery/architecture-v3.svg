<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1130" role="img"><title>architecture-v3</title><defs><marker id="a-cyan" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#22d3ee"/></marker><marker id="a-green" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#34d399"/></marker><marker id="a-purple" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#a78bfa"/></marker><marker id="a-amber" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#fbbf24"/></marker><marker id="a-rose" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#fb7185"/></marker><marker id="a-gray" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#94a3b8"/></marker><marker id="a-blue" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#60a5fa"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern></defs><style>text{font-family:"Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/><rect x="30" y="165" width="1460" height="205" rx="16" fill="none" stroke="#475569" stroke-dasharray="8 5"/><rect x="30" y="400" width="1460" height="235" rx="16" fill="none" stroke="#475569" stroke-dasharray="8 5"/><rect x="30" y="665" width="1460" height="330" rx="16" fill="none" stroke="#475569" stroke-dasharray="8 5"/><polyline points="1060,285 415,285" fill="none" stroke="#fbbf24" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#a-amber)"/><polyline points="1060,515 920,515" fill="none" stroke="#22d3ee" stroke-width="1.7" marker-end="url(#a-cyan)"/><polyline points="570,535 415,535" fill="none" stroke="#22d3ee" stroke-width="1.7" marker-end="url(#a-cyan)"/><polyline points="240,585 240,605 1255,605 1255,585" fill="none" stroke="#fb7185" stroke-width="1.7" marker-end="url(#a-rose)"/><polyline points="415,800 570,800" fill="none" stroke="#34d399" stroke-width="1.7" marker-end="url(#a-green)"/><polyline points="920,800 1060,800" fill="none" stroke="#fb7185" stroke-width="1.7" marker-end="url(#a-rose)"/><polyline points="240,855 240,900" fill="none" stroke="#94a3b8" stroke-width="1.7" marker-end="url(#a-gray)"/><polyline points="1255,855 1255,900" fill="none" stroke="#94a3b8" stroke-width="1.7" marker-end="url(#a-gray)"/><rect x="65" y="240" width="350" height="90" rx="10" fill="#0f172a"/><rect x="65" y="240" width="350" height="90" rx="10" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-width="1.5"/><rect x="1060" y="240" width="390" height="90" rx="10" fill="#0f172a"/><rect x="1060" y="240" width="390" height="90" rx="10" fill="#fbbf24" fill-opacity=".08" stroke="#fbbf24" stroke-width="1.5"/><rect x="65" y="485" width="350" height="100" rx="10" fill="#0f172a"/><rect x="65" y="485" width="350" height="100" rx="10" fill="#a78bfa" fill-opacity=".08" stroke="#a78bfa" stroke-width="1.5"/><rect x="570" y="485" width="350" height="100" rx="10" fill="#0f172a"/><rect x="570" y="485" width="350" height="100" rx="10" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-width="1.5"/><rect x="1060" y="485" width="390" height="100" rx="10" fill="#0f172a"/><rect x="1060" y="485" width="390" height="100" rx="10" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-width="1.5"/><rect x="65" y="745" width="350" height="110" rx="10" fill="#0f172a"/><rect x="65" y="745" width="350" height="110" rx="10" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-width="1.5"/><rect x="570" y="745" width="350" height="110" rx="10" fill="#0f172a"/><rect x="570" y="745" width="350" height="110" rx="10" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-width="1.5"/><rect x="1060" y="745" width="390" height="110" rx="10" fill="#0f172a"/><rect x="1060" y="745" width="390" height="110" rx="10" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-width="1.5"/><rect x="65" y="900" width="350" height="65" rx="10" fill="#0f172a"/><rect x="65" y="900" width="350" height="65" rx="10" fill="#a78bfa" fill-opacity=".08" stroke="#a78bfa" stroke-width="1.5"/><rect x="1060" y="900" width="390" height="65" rx="10" fill="#0f172a"/><rect x="1060" y="900" width="390" height="65" rx="10" fill="#a78bfa" fill-opacity=".08" stroke="#a78bfa" stroke-width="1.5"/><text x="40" y="48" text-anchor="start" font-size="30" fill="#f1f5f9">拾文 · 三条通信路径</text><text x="40" y="83" text-anchor="start" font-size="17" fill="#94a3b8">方案 v3 · 尚未实施 · 名称和 IP 只用于定位，可信服务身份用于确认连接对象</text><text x="240" y="135" text-anchor="middle" font-size="22" fill="#22d3ee">Android 手机</text><text x="1240" y="135" text-anchor="middle" font-size="22" fill="#34d399">电脑端拾文</text><text x="50" y="195" text-anchor="start" font-size="20" fill="#fbbf24">① 发现路径 · 自动寻找候选地址，不传凭据或资料</text><text x="240.0" y="270" text-anchor="middle" font-size="20" fill="#f1f5f9">发现管理器〔新增〕</text><text x="240.0" y="297" text-anchor="middle" font-size="16" fill="#94a3b8">Android NSD · 网络变化触发</text><text x="240.0" y="321" text-anchor="middle" font-size="16" fill="#94a3b8">结果进入候选地址池</text><text x="1255.0" y="270" text-anchor="middle" font-size="20" fill="#f1f5f9">发现公告〔新增〕</text><text x="1255.0" y="297" text-anchor="middle" font-size="16" fill="#94a3b8">mDNS / DNS-SD · _shiwen._tcp</text><text x="1255.0" y="321" text-anchor="middle" font-size="16" fill="#94a3b8">仅公告已就绪、实际可达的入口</text><text x="735" y="265" text-anchor="middle" font-size="15" fill="#fbbf24">名称 / 地址 / 端口 / 协议 / 自报身份指纹</text><text x="50" y="430" text-anchor="start" font-size="20" fill="#fbbf24">② 配对路径 · 用户确认一次，建立可信服务身份</text><text x="240.0" y="515" text-anchor="middle" font-size="20" fill="#f1f5f9">可信节点配置〔改造〕</text><text x="240.0" y="542" text-anchor="middle" font-size="16" fill="#94a3b8">保留原 nodeId · 加密存储</text><text x="240.0" y="566" text-anchor="middle" font-size="16" fill="#94a3b8">验证成功后才提交身份和授权</text><text x="745.0" y="515" text-anchor="middle" font-size="20" fill="#f1f5f9">用户扫描电脑二维码</text><text x="745.0" y="542" text-anchor="middle" font-size="16" fill="#94a3b8">独立可信来源确认公钥指纹</text><text x="745.0" y="566" text-anchor="middle" font-size="16" fill="#94a3b8">短期、一次性配对凭据</text><text x="1255.0" y="515" text-anchor="middle" font-size="20" fill="#f1f5f9">身份与配对模块〔新增〕</text><text x="1255.0" y="542" text-anchor="middle" font-size="16" fill="#94a3b8">持久服务密钥 · 一次性凭据核销</text><text x="1255.0" y="566" text-anchor="middle" font-size="16" fill="#94a3b8">授权对接现有服务端认证</text><text x="992" y="495" text-anchor="middle" font-size="15" fill="#22d3ee">显示二维码</text><text x="493" y="515" text-anchor="middle" font-size="15" fill="#22d3ee">扫码核验</text><text x="810" y="625" text-anchor="middle" font-size="15" fill="#fb7185">通过已核验的加密连接完成配对；不信任发现公告本身</text><text x="50" y="695" text-anchor="start" font-size="20" fill="#fbbf24">③ 业务路径 · 自动握手、选择地址和执行请求</text><text x="240.0" y="775" text-anchor="middle" font-size="20" fill="#f1f5f9">统一连接协调器〔新增〕</text><text x="240.0" y="802" text-anchor="middle" font-size="16" fill="#94a3b8">握手监控 · 候选选择 · 失败退避</text><text x="240.0" y="826" text-anchor="middle" font-size="16" fill="#94a3b8">正常地址优先；配置版本 ≠ 连接代次</text><text x="240.0" y="850" text-anchor="middle" font-size="16" fill="#94a3b8">页面订阅状态，同步请求可用连接</text><text x="745.0" y="775" text-anchor="middle" font-size="20" fill="#f1f5f9">可信连接客户端〔改造〕</text><text x="745.0" y="802" text-anchor="middle" font-size="16" fill="#94a3b8">HTTPS · 核验配对公钥</text><text x="745.0" y="826" text-anchor="middle" font-size="16" fill="#94a3b8">验证身份后才发送授权和资料</text><text x="745.0" y="850" text-anchor="middle" font-size="16" fill="#94a3b8">禁止自动向未配对地址发送凭据</text><text x="1255.0" y="775" text-anchor="middle" font-size="20" fill="#f1f5f9">可信入口 + 既有业务服务</text><text x="1255.0" y="802" text-anchor="middle" font-size="16" fill="#94a3b8">入口 / 认证方式需先技术验证</text><text x="1255.0" y="826" text-anchor="middle" font-size="16" fill="#94a3b8">复用同步、附件、聊天和操作回执</text><text x="1255.0" y="850" text-anchor="middle" font-size="16" fill="#94a3b8">网络入口生命周期与资料库分离</text><text x="492" y="780" text-anchor="middle" font-size="15" fill="#34d399">选择 / 固定连接</text><text x="990" y="780" text-anchor="middle" font-size="15" fill="#fb7185">业务请求</text><text x="240.0" y="930" text-anchor="middle" font-size="20" fill="#f1f5f9">手机资料库〔复用〕</text><text x="240.0" y="957" text-anchor="middle" font-size="16" fill="#94a3b8">游标、待上传记录、附件进度</text><text x="1255.0" y="930" text-anchor="middle" font-size="20" fill="#f1f5f9">电脑资料库〔复用〕</text><text x="1255.0" y="957" text-anchor="middle" font-size="16" fill="#94a3b8">服务私钥与普通资料备份分开</text><text x="760.0" y="1040" text-anchor="middle" font-size="17" fill="#fbbf24">在线与授权分开：服务可达但凭据失效 = 在线 · 需要登录；身份不匹配不作为可用节点</text><text x="760" y="1080" text-anchor="middle" font-size="17" fill="#94a3b8">实施门槛：先验证可信入口、认证复用、旧 HTTP 兼容和网络入口切换；图中新增能力尚未上线</text></svg>