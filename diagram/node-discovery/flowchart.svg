<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 2180" role="img"><title>flowchart</title><defs><marker id="a-cyan" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#22d3ee"/></marker><marker id="a-green" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#34d399"/></marker><marker id="a-purple" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#a78bfa"/></marker><marker id="a-amber" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#fbbf24"/></marker><marker id="a-rose" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#fb7185"/></marker><marker id="a-gray" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#94a3b8"/></marker><marker id="a-blue" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#60a5fa"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern></defs><style>text{font-family:"Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/><rect x="30" y="120" width="1440" height="1280" rx="16" fill="none" stroke="#475569" stroke-dasharray="8 5"/><rect x="30" y="1430" width="1440" height="620" rx="16" fill="none" stroke="#475569" stroke-dasharray="8 5"/><polyline points="450,255 450,295" fill="none" stroke="#94a3b8" stroke-width="1.7" marker-end="url(#a-gray)"/><polyline points="630,340 970,340" fill="none" stroke="#fb7185" stroke-width="1.7" marker-end="url(#a-rose)"/><polyline points="450,385 450,425" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="450,525 450,565" fill="none" stroke="#94a3b8" stroke-width="1.7" marker-end="url(#a-gray)"/><polyline points="630,610 970,610" fill="none" stroke="#fb7185" stroke-width="1.7" marker-end="url(#a-rose)"/><polyline points="450,655 450,720" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="630,765 970,765" fill="none" stroke="#22d3ee" stroke-width="1.7" marker-end="url(#a-cyan)"/><polyline points="450,810 450,875" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="630,920 970,920" fill="none" stroke="#fb7185" stroke-width="1.7" marker-end="url(#a-rose)"/><polyline points="450,965 450,1030" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="630,1075 970,1075" fill="none" stroke="#fb7185" stroke-width="1.7" marker-end="url(#a-rose)"/><polyline points="450,1120 450,1200" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="450,1300 450,1480" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="650,1525 970,1525" fill="none" stroke="#fb7185" stroke-width="1.7" marker-end="url(#a-rose)"/><polyline points="450,1570 450,1635" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><polyline points="450,1725 450,1775" fill="none" stroke="#94a3b8" stroke-width="1.7" marker-end="url(#a-gray)"/><polyline points="630,1820 970,1820" fill="none" stroke="#fb7185" stroke-width="1.7" marker-end="url(#a-rose)"/><polyline points="450,1865 450,1940" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#a-blue)"/><rect x="240" y="175" width="420" height="80" rx="10" fill="#0f172a"/><rect x="240" y="175" width="420" height="80" rx="10" fill="#60a5fa" fill-opacity=".08" stroke="#60a5fa" stroke-width="1.5"/><polygon points="450,295.0 630.0,340 450,385.0 270.0,340" fill="#172333" stroke="#fbbf24" stroke-width="1.5"/><rect x="970" y="300" width="420" height="80" rx="10" fill="#0f172a"/><rect x="970" y="300" width="420" height="80" rx="10" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-width="1.5"/><rect x="240" y="425" width="420" height="100" rx="10" fill="#0f172a"/><rect x="240" y="425" width="420" height="100" rx="10" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-width="1.5"/><polygon points="450,565.0 630.0,610 450,655.0 270.0,610" fill="#172333" stroke="#fbbf24" stroke-width="1.5"/><rect x="970" y="565" width="420" height="100" rx="10" fill="#0f172a"/><rect x="970" y="565" width="420" height="100" rx="10" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-width="1.5"/><polygon points="450,720.0 630.0,765 450,810.0 270.0,765" fill="#172333" stroke="#fbbf24" stroke-width="1.5"/><rect x="970" y="720" width="420" height="100" rx="10" fill="#0f172a"/><rect x="970" y="720" width="420" height="100" rx="10" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-width="1.5"/><polygon points="450,875.0 630.0,920 450,965.0 270.0,920" fill="#172333" stroke="#fbbf24" stroke-width="1.5"/><rect x="970" y="875" width="420" height="100" rx="10" fill="#0f172a"/><rect x="970" y="875" width="420" height="100" rx="10" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-width="1.5"/><polygon points="450,1030.0 630.0,1075 450,1120.0 270.0,1075" fill="#172333" stroke="#fbbf24" stroke-width="1.5"/><rect x="970" y="1030" width="420" height="100" rx="10" fill="#0f172a"/><rect x="970" y="1030" width="420" height="100" rx="10" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-width="1.5"/><rect x="240" y="1200" width="420" height="100" rx="10" fill="#0f172a"/><rect x="240" y="1200" width="420" height="100" rx="10" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-width="1.5"/><polygon points="450,1480.0 650.0,1525 450,1570.0 250.0,1525" fill="#172333" stroke="#fbbf24" stroke-width="1.5"/><rect x="970" y="1480" width="420" height="90" rx="10" fill="#0f172a"/><rect x="970" y="1480" width="420" height="90" rx="10" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-width="1.5"/><rect x="240" y="1635" width="420" height="90" rx="10" fill="#0f172a"/><rect x="240" y="1635" width="420" height="90" rx="10" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-width="1.5"/><polygon points="450,1775.0 630.0,1820 450,1865.0 270.0,1820" fill="#172333" stroke="#fbbf24" stroke-width="1.5"/><rect x="970" y="1760" width="420" height="120" rx="10" fill="#0f172a"/><rect x="970" y="1760" width="420" height="120" rx="10" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-width="1.5"/><rect x="240" y="1940" width="420" height="80" rx="10" fill="#0f172a"/><rect x="240" y="1940" width="420" height="80" rx="10" fill="#60a5fa" fill-opacity=".08" stroke="#60a5fa" stroke-width="1.5"/><text x="40" y="48" text-anchor="start" font-size="30" fill="#f1f5f9">拾文 · 从发现到同步恢复的流程</text><text x="40" y="83" text-anchor="start" font-size="17" fill="#94a3b8">实施方案 v2 · 主路径向下；右侧为分支处理 · A / B 是返回连接点</text><text x="50" y="150" text-anchor="start" font-size="20" fill="#fbbf24">阶段一：发现、验证与选择连接</text><text x="50" y="1460" text-anchor="start" font-size="20" fill="#fbbf24">阶段二：同步与断线恢复</text><text x="450.0" y="205" text-anchor="middle" font-size="20" fill="#f1f5f9">打开应用 / 回到前台 / 网络变化</text><text x="450.0" y="232" text-anchor="middle" font-size="16" fill="#94a3b8">或前台定时握手、用户重试</text><text x="450" y="346" text-anchor="middle" font-size="18" fill="#f1f5f9">当前网络可用？</text><text x="1180.0" y="330" text-anchor="middle" font-size="20" fill="#f1f5f9">当前网络不可用</text><text x="1180.0" y="357" text-anchor="middle" font-size="16" fill="#94a3b8">保留离线记录；网络恢复后重新检查</text><text x="790" y="325" text-anchor="middle" font-size="15" fill="#fb7185">否</text><text x="450.0" y="455" text-anchor="middle" font-size="20" fill="#f1f5f9">A · 协调器收集候选地址</text><text x="450.0" y="482" text-anchor="middle" font-size="16" fill="#94a3b8">当前地址 → 历史 / 手动备用 → NSD 发现</text><text x="450.0" y="506" text-anchor="middle" font-size="16" fill="#94a3b8">限制并发；一次只进行一轮选择</text><text x="477" y="410" text-anchor="middle" font-size="15" fill="#60a5fa">是</text><text x="450" y="616" text-anchor="middle" font-size="18" fill="#f1f5f9">候选地址可连接？</text><text x="1180.0" y="595" text-anchor="middle" font-size="20" fill="#f1f5f9">尝试其他候选地址</text><text x="1180.0" y="622" text-anchor="middle" font-size="16" fill="#94a3b8">有候选：返回 A；全部失败：退避重试</text><text x="1180.0" y="646" text-anchor="middle" font-size="16" fill="#94a3b8">连续失败显示离线，不删除地址配置</text><text x="790" y="595" text-anchor="middle" font-size="15" fill="#fb7185">否</text><text x="450" y="771" text-anchor="middle" font-size="18" fill="#f1f5f9">已有可信配对？</text><text x="478" y="689" text-anchor="middle" font-size="15" fill="#60a5fa">是</text><text x="1180.0" y="750" text-anchor="middle" font-size="20" fill="#f1f5f9">显示附近服务 / 扫码配对</text><text x="1180.0" y="777" text-anchor="middle" font-size="16" fill="#94a3b8">用户确认身份 → 绑定原 nodeId → 返回 A</text><text x="1180.0" y="801" text-anchor="middle" font-size="16" fill="#94a3b8">取消时保留原节点；不自动携带旧凭据</text><text x="790" y="750" text-anchor="middle" font-size="15" fill="#22d3ee">否</text><text x="450" y="926" text-anchor="middle" font-size="18" fill="#f1f5f9">加密连接身份匹配？</text><text x="478" y="848" text-anchor="middle" font-size="15" fill="#60a5fa">是</text><text x="1180.0" y="905" text-anchor="middle" font-size="20" fill="#f1f5f9">拒绝此候选地址</text><text x="1180.0" y="932" text-anchor="middle" font-size="16" fill="#94a3b8">显示身份异常；不发送登录凭据或资料</text><text x="1180.0" y="956" text-anchor="middle" font-size="16" fill="#94a3b8">仍可尝试其他已知候选 → A</text><text x="790" y="905" text-anchor="middle" font-size="15" fill="#fb7185">否</text><text x="450" y="1081" text-anchor="middle" font-size="18" fill="#f1f5f9">授权与接口可用？</text><text x="478" y="1003" text-anchor="middle" font-size="15" fill="#60a5fa">是</text><text x="1180.0" y="1060" text-anchor="middle" font-size="20" fill="#f1f5f9">按原因处理，不统称离线</text><text x="1180.0" y="1087" text-anchor="middle" font-size="16" fill="#94a3b8">授权失效：重新登录 / 授权后返回 A</text><text x="1180.0" y="1111" text-anchor="middle" font-size="16" fill="#94a3b8">接口异常 / 版本不兼容：提示具体原因</text><text x="790" y="1060" text-anchor="middle" font-size="15" fill="#fb7185">否</text><text x="450.0" y="1230" text-anchor="middle" font-size="20" fill="#f1f5f9">在线 · 保持或切换当前地址</text><text x="450.0" y="1257" text-anchor="middle" font-size="16" fill="#94a3b8">必要时增加连接代次；保留资料库绑定</text><text x="450.0" y="1281" text-anchor="middle" font-size="16" fill="#94a3b8">记录成功时间；只握手时结束本轮</text><text x="478" y="1160" text-anchor="middle" font-size="15" fill="#60a5fa">是</text><text x="1030" y="1235" text-anchor="middle" font-size="21" fill="#fbbf24">发现不到 ≠ 服务离线</text><text x="1030" y="1270" text-anchor="middle" font-size="17" fill="#94a3b8">权限不足 / 多播被屏蔽时仍尝试已知地址</text><text x="1030" y="1300" text-anchor="middle" font-size="17" fill="#94a3b8">后台暂停持续发现；回到前台重新确认状态</text><text x="525" y="1360" text-anchor="middle" font-size="15" fill="#60a5fa">有同步任务</text><text x="450" y="1531" text-anchor="middle" font-size="18" fill="#f1f5f9">B · libraryId / epoch 一致？</text><text x="1180.0" y="1510" text-anchor="middle" font-size="20" fill="#f1f5f9">暂停同步，处理资料库变更</text><text x="1180.0" y="1537" text-anchor="middle" font-size="16" fill="#94a3b8">服务可信也不能直接接续不同资料库</text><text x="800" y="1510" text-anchor="middle" font-size="15" fill="#fb7185">否</text><text x="450.0" y="1665" text-anchor="middle" font-size="20" fill="#f1f5f9">固定连接代次，执行 / 恢复同步</text><text x="450.0" y="1692" text-anchor="middle" font-size="16" fill="#94a3b8">沿用操作编号、游标和附件进度</text><text x="478" y="1608" text-anchor="middle" font-size="15" fill="#60a5fa">是</text><text x="450" y="1826" text-anchor="middle" font-size="18" fill="#f1f5f9">请求结果已明确？</text><text x="1180.0" y="1790" text-anchor="middle" font-size="20" fill="#f1f5f9">断线或写入结果未知</text><text x="1180.0" y="1817" text-anchor="middle" font-size="16" fill="#94a3b8">保留待上传与临时附件 → A 重连</text><text x="1180.0" y="1841" text-anchor="middle" font-size="16" fill="#94a3b8">通过身份核验后回到 B，再核对原操作</text><text x="1180.0" y="1865" text-anchor="middle" font-size="16" fill="#94a3b8">读可重试；写必须按原编号确认</text><text x="790" y="1805" text-anchor="middle" font-size="15" fill="#fb7185">否</text><text x="450.0" y="1970" text-anchor="middle" font-size="20" fill="#f1f5f9">确认结果并更新同步进度</text><text x="450.0" y="1997" text-anchor="middle" font-size="16" fill="#94a3b8">拒绝则显示具体原因；成功才推进游标</text><text x="478" y="1907" text-anchor="middle" font-size="15" fill="#60a5fa">是</text><text x="750" y="2100" text-anchor="middle" font-size="18" fill="#fbbf24">不变量：切换地址不新建节点、不重建手机资料库、不清空游标；旧响应不能覆盖新连接状态</text><text x="750" y="2140" text-anchor="middle" font-size="17" fill="#94a3b8">离线是“当前手机无法连接”；首次配对 / 服务身份 / 资料库身份必须分别核验</text></svg>