<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1060" role="img" aria-labelledby="title desc">
<title id="title">拾文系统架构</title>
<desc id="desc">桌面和浏览器访问 DSH 独立服务，共用服务端资料库；Android 通过原生层保存本地资料并与服务同步。模型与外部 Agent 接入单独呈现。</desc>
