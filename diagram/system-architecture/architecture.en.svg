<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1060" role="img" aria-labelledby="title desc">
<title id="title">Shiwen system architecture</title>
<desc id="desc">Desktop and browsers share a server library. Android persists its own local library and syncs with the service. Model calls and external Agent access are shown separately.</desc>
